name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: PHPCS + PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer audit
      - run: composer lint
      - run: composer analyse

  unit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        experimental: [false]
        include:
          - php: '8.6'
            experimental: true
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - run: composer test

  activation:
    name: Activate (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, WC ${{ matrix.wc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported row. WooCommerce 9.9 needs a newer WordPress than our
          # 6.5 header minimum, so this row uses the oldest WordPress that WC 9.9 accepts.
          - { php: '8.2', wp: '6.7', wc: '9.9.0' }
          - { php: '8.3', wp: 'latest', wc: 'latest-stable' }
          - { php: '8.4', wp: 'latest', wc: 'latest-stable' }
          - { php: '8.5', wp: 'latest', wc: 'latest-stable' }
    steps:
      - uses: actions/checkout@v5
      # vendor/ is mounted into the wp-env containers, where the integration tests run.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer install --no-progress --prefer-dist
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Plugins are mapped (not listed under "plugins") so their folders are exactly
      # "woocommerce" and "rachnix-checkout-fields", and nothing is activated before the
      # step below activates WooCommerce first. Our "Requires Plugins: woocommerce"
      # header only resolves when WooCommerce lives in a folder named "woocommerce".
      - name: Configure wp-env for this row
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then CORE=null; else CORE="\"WordPress/WordPress#${{ matrix.wp }}\""; fi
          cat > .wp-env.override.json <<EOF
          {
            "core": ${CORE},
            "phpVersion": "${{ matrix.php }}",
            "plugins": [],
            "mappings": {
              "wp-content/plugins/woocommerce": "https://downloads.wordpress.org/plugin/woocommerce.${{ matrix.wc }}.zip",
              "wp-content/plugins/rachnix-checkout-fields": "."
            }
          }
          EOF
      - run: npx --yes @wordpress/env@10 start
      - name: Activate on single site
        run: |
          npx @wordpress/env@10 run cli wp plugin activate woocommerce
          npx @wordpress/env@10 run cli wp plugin activate rachnix-checkout-fields
          npx @wordpress/env@10 run cli wp eval-file wp-content/plugins/rachnix-checkout-fields/tests/smoke/activation.php
      - name: Show installed plugins (on failure)
        if: failure()
        run: npx @wordpress/env@10 run cli wp plugin list
      - name: Activate with HPOS off (legacy posts storage)
        run: |
          npx @wordpress/env@10 run cli wp option update woocommerce_custom_orders_table_enabled no
          npx @wordpress/env@10 run cli wp eval-file wp-content/plugins/rachnix-checkout-fields/tests/smoke/activation.php
      - name: Integration tests (migrations up/down, repository)
        run: |
          npx @wordpress/env@10 run cli --env-cwd=wp-content/plugins/rachnix-checkout-fields php vendor/bin/phpunit -c phpunit-integration.xml.dist
      - name: Fail on PHP errors from this plugin
        run: |
          npx @wordpress/env@10 run cli bash -c 'test ! -f wp-content/debug.log || ! grep -i "rachnix-checkout-fields" wp-content/debug.log'

  e2e:
    name: E2E classic checkout (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx wp-env start
      - name: Activate plugins (WooCommerce first)
        run: |
          npx wp-env run cli wp plugin activate woocommerce
          npx wp-env run cli wp plugin activate rachnix-checkout-fields
      - run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
